name: groopx
description: Private messaging, groups, communities and calls.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.2.7
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.1
  file_picker: ^8.1.2
  livekit_client: ^2.13.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  image_picker: ^1.1.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
